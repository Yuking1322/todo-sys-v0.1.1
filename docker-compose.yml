services:
  db:
    image: postgres:16-alpine
    container_name: todo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_openclaw_sync}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      DATA_BACKEND: postgres
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-todo_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-todo_openclaw_sync}
      APP_WRITE_TOKEN: ${APP_WRITE_TOKEN:?APP_WRITE_TOKEN is required}
      OPENCLAW_SYNC_TOKEN: ${OPENCLAW_SYNC_TOKEN:?OPENCLAW_SYNC_TOKEN is required}
      AI_API_BASE: ${AI_API_BASE:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      HOLIDAY_YEAR_API: https://timor.tech/api/holiday/year
      HOLIDAY_FALLBACK_API: https://date.nager.at/api/v3/PublicHolidays
      HOLIDAY_FETCH_TIMEOUT_MS: 8000
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: todo_nginx
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_started

volumes:
  pg_data:
